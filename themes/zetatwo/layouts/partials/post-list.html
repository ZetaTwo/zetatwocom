{{/* One page of post summaries; expects a paginator. */}}
<ul class="post-list">
  {{ range .Pages }}
    <li>
      <span class="post-meta-list"><span>{{ .Date.Format "Jan" }}</span> <span>{{ .Date.Format "2" }}</span> <span>{{ .Date.Format "2006" }}</span></span>

      <h2 class="post-link">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h2>
      {{ .Summary }}
      <div class="post-read-more"><a href="{{ .RelPermalink }}">Read more</a></div>
    </li>
  {{ end }}
</ul>
