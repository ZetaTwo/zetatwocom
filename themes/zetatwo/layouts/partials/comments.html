{{/* Comments archived from Disqus (shortname "zetatwo"), stored in data/comments.json keyed by post URL. */}}
{{ with index hugo.Data.comments .RelPermalink }}
<section class="comments">
  <h2 class="comments-heading">Comments</h2>
  <p class="comments-note">Archived from Disqus. Commenting is closed.</p>
  <ul class="comment-list">
    {{ range . }}{{ partial "comment.html" . }}{{ end }}
  </ul>
</section>
{{ end }}
