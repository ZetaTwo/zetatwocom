baseURL = "https://zeta-two.com/"
title = "Zeta-Two.com"
theme = "zetatwo"

# Category pages are the posts/<cat>/ sections (served at /<cat>/); no taxonomy pages.
disableKinds = ["taxonomy", "term"]

[services.rss]
  limit = 10

[pagination]
  pagerSize = 5

[params]
  description = "My blog about technology, security and life."
  author = "Calle Svensson"
  email = "calle.svensson@zeta-two.com"
  github_username = "ZetaTwo"
  twitter_username = "zetatwo"
  youtube_username = "ZetaTwo"
  # Default link-preview image (OpenGraph / Twitter card) for pages without their own.
  images = ["/img/og-image.png"]

[permalinks]
  # Mirror Jekyll's /{category}/{year}/{month}/{day}/{slug}/ URL structure.
  # Posts live at content/posts/<cat>/<date>-<slug>.md; :sections[1:] drops the
  # leading "posts" so the URL becomes /<cat>/<year>/<month>/<day>/<slug>/.
  # Requires an _index.md in each category subdirectory so Hugo treats the
  # category as a sub-section (otherwise :sections is just ["posts"]).
  # The :slug placeholder reads per-post `slug:` frontmatter.
  posts = "/:sections[1:]/:year/:month/:day/:slug/"

[outputFormats.RSS]
  # Match Jekyll's /feed.xml URL instead of Hugo's default /index.xml.
  baseName = "feed"

[markup.goldmark.extensions.passthrough]
  # Math is left untouched by Goldmark (no typographer, no emphasis) and
  # rendered at build time by the theme's render-passthrough hook.
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]']]
    inline = [['\(', '\)']]

[markup.highlight]
  # Emit CSS classes; the colours live in themes/zetatwo/assets/css/syntax-highlighting.css.
  noClasses = false
